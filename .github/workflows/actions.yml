name: Resume Generation
on: push

jobs:
  build_resume:
    runs-on: ubuntu-latest
    steps:
      - name: Clone Repository
        uses: actions/checkout@v2

      - name: Clean up LaTeX build files
        run: |
          rm -rf *.aux *.bbl *.blg *.log *.out *.toc

      - name: Compile LaTeX document
        uses: xu-cheng/latex-action@v2
        with:
          root_file: SiddarthaMuppalla_Resume.tex
          latexmk_use_xelatex: true

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Make Directory Structure
        run: |
          mkdir -p ${{ steps.extract_branch.outputs.branch }}
          mv SiddarthaMuppalla_Resume.pdf ${{ steps.extract_branch.outputs.branch }}/

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: ${{ steps.extract_branch.outputs.branch }}/SiddarthaMuppalla_Resume.pdf

  upload_to_drive:
    needs: build_resume
    runs-on: ubuntu-latest
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@v4
        with:
          name: resume-pdf
          path: ./downloaded_artifact

      - name: List downloaded files (debug)
        run: ls -laR downloaded_artifact || true

      - name: Find resume PDF
        id: find_resume
        shell: bash
        run: |
          file=$(find downloaded_artifact -type f -iname '*SiddarthaMuppalla_Resume*.pdf' | head -n1)
          if [ -z "$file" ]; then
            echo "No resume PDF found under downloaded_artifact" >&2
            exit 1
          fi
          echo "Found resume at: $file"
          echo "resume_path=$file" >> $GITHUB_OUTPUT

      - name: Extract branch name
        id: extract_branch
        shell: bash
        run: echo "branch=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_OUTPUT

      - name: Prepare upload path
        run: |
          mkdir -p "${{ steps.extract_branch.outputs.branch }}"
          cp "${{ steps.find_resume.outputs.resume_path }}" "${{ steps.extract_branch.outputs.branch }}/SiddarthaMuppalla_Resume.pdf"

      - name: Verify upload file (debug)
        run: ls -la "${{ steps.extract_branch.outputs.branch }}" || true

      - name: Upload file to Google Drive
        uses: adityak74/google-drive-upload-git-action@main
        with:
          credentials: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          filename: ${{ steps.extract_branch.outputs.branch }}/SiddarthaMuppalla_Resume.pdf
          folderId: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          overwrite: "true"
          mirrorDirectoryStructure: "true"
